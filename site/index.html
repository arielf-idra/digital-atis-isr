<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital ATIS</title>
<meta name="description" content="Unofficial text transcription of broadcast ATIS. Not for operational use.">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #14171c; --muted: #5d6573; --line: #e2e5ea;
    --ok: #1a7f4b; --warn: #a15c00; --bad: #b3261e; --accent: #1f5fbf;
    --warn-bg: #fff4e0; --bad-bg: #fdecea;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181c22; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a303a;
      --ok: #4cc38a; --warn: #f0b04a; --bad: #ff7a70; --accent: #7aa7ff;
      --warn-bg: #3a2c12; --bad-bg: #3d1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  h1 small { color: var(--muted); font-weight: 500; }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); }
  .disclaimer { font-size: 13px; color: var(--muted); margin: 6px 0 16px; }
  .banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; display: none; }
  .banner.warn { display: block; background: var(--warn-bg); color: var(--warn); }
  .banner.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .top { display: flex; gap: 18px; align-items: center; }
  .letter { font: 700 64px/1 var(--mono); width: 96px; height: 96px; border-radius: 16px; display: grid;
            place-items: center; background: var(--ink); color: var(--card); flex: none; }
  .top h2 { margin: 0 0 4px; font-size: 22px; }
  .meta { color: var(--muted); font-size: 14px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
  .field { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .field .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .field .v { font: 600 18px/1.3 var(--mono); }
  .field .s { font-size: 12px; }
  .s.confirmed, .s.majority { color: var(--ok); }
  .s.single { color: var(--warn); }
  .s.conflict, .s.missing { color: var(--bad); }
  .text { font: 15px/1.6 var(--mono); white-space: pre-wrap; margin: 0; }
  h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  audio { width: 100%; margin-top: 12px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 10px; }
  details p { font: 13px/1.5 var(--mono); color: var(--muted); }
  .history { list-style: none; padding: 0; margin: 0; }
  .history li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .history li:first-child { border-top: none; }
  .history b { font: 700 18px var(--mono); }
  .history span { font-size: 13px; color: var(--muted); }
  footer { font-size: 13px; color: var(--muted); text-align: center; margin-top: 24px; }
  a { color: var(--accent); }
  @media (max-width: 480px) { .letter { width: 72px; height: 72px; font-size: 48px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Digital ATIS <small id="stationName"></small></h1>
    <select id="stationSelect" aria-label="Station"></select>
  </header>
  <p class="disclaimer">Unofficial automatic transcription of the broadcast ATIS. <strong>Not for operational use</strong> —
    always listen to the official ATIS on frequency.</p>

  <div id="banner" class="banner"></div>

  <section class="card">
    <div class="top">
      <div class="letter" id="letter">–</div>
      <div>
        <h2 id="headline">Loading…</h2>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="fields" id="fields"></div>
  </section>

  <section class="card">
    <h3>Transcript</h3>
    <p class="text" id="text"></p>
    <audio id="audio" controls preload="none"></audio>
    <details>
      <summary>All loop transcriptions</summary>
      <div id="raw"></div>
    </details>
  </section>

  <section class="card">
    <h3>Recent broadcasts</h3>
    <ul class="history" id="history"></ul>
  </section>

  <footer>
    Updated automatically from the station's public audio stream.
    <a href="https://github.com/" id="repoLink">Source on GitHub</a>
  </footer>
</main>

<script>
const STATIONS = { LLHA: "Haifa" };
const LABELS = {
  time: "Issued (UTC)", runway: "Runway", circuit: "Circuit", wind: "Wind", visibility: "Visibility",
  clouds: "Clouds", temperature: "Temp °C", dewpoint: "Dew point °C", qnh: "QNH hPa",
};
const STATUS_TEXT = {
  confirmed: n => `✓ heard ${n.votes}×`,
  majority: n => `✓ ${n.votes} of ${n.of} agree`,
  single: () => "⚠ heard once, unconfirmed",
  conflict: n => `✕ unclear (${n.readings.join(" / ")})`,
};
const STALE_MIN = 20;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const icao = (params.get("station") || "LLHA").toUpperCase();

for (const [code, name] of Object.entries(STATIONS)) {
  const o = new Option(`${code} – ${name}`, code, code === icao, code === icao);
  $("stationSelect").add(o);
}
$("stationSelect").onchange = e => { location.search = `?station=${e.target.value}`; };
if (location.hostname.endsWith("github.io")) {
  const [user] = location.hostname.split(".");
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  $("repoLink").href = `https://github.com/${user}/${repo}`;
}

function ago(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min} min ago`;
  return `${Math.floor(min / 60)} h ${min % 60} min ago`;
}
function utc(iso) { return iso ? iso.slice(11, 16) + "Z" : "—"; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(d) {
  $("stationName").textContent = `${d.station.icao} ${d.station.name} · ${d.station.frequency}`;
  $("letter").textContent = d.letter || "?";
  $("headline").textContent = d.letter ? `Information ${d.letter}` : "ATIS letter not recognised";
  $("meta").textContent = `First heard ${utc(d.first_seen)} · last checked ${ago(d.checked_at)} (${utc(d.checked_at)})`;

  const banner = $("banner");
  const ageMin = (Date.now() - Date.parse(d.checked_at)) / 60000;
  banner.className = "banner";
  if (d.status === "offline") {
    banner.className = "banner bad";
    banner.textContent = `Stream unavailable since ${utc(d.checked_at)} — showing the last ATIS received.`;
  } else if (ageMin > STALE_MIN) {
    banner.className = "banner bad";
    banner.textContent = `Data is stale: last update ${ago(d.checked_at)}.`;
  } else if (d.status === "unreadable" || d.quality === "poor") {
    banner.className = "banner bad";
    banner.textContent = "The latest recording could not be read reliably.";
  } else if (d.quality === "partial") {
    banner.className = "banner warn";
    banner.textContent = "Some items could not be confirmed — check the transcript and audio.";
  }

  const fields = $("fields");
  fields.replaceChildren();
  for (const [key, label] of Object.entries(LABELS)) {
    const f = (d.fields || {})[key];
    const box = el("div", "field");
    box.append(el("div", "k", label));
    box.append(el("div", "v", f && f.value != null ? String(f.value) : "—"));
    const status = f ? f.status : "missing";
    box.append(el("div", `s ${status}`, f ? STATUS_TEXT[status](f) : "not heard"));
    fields.append(box);
  }

  $("text").textContent = d.text || "";
  $("audio").src = `data/${icao}/latest.mp3?t=${Date.parse(d.checked_at)}`;
  const raw = $("raw");
  raw.replaceChildren(...(d.transcripts || []).map((t, i) =>
    el("p", null, `Loop ${i + 1} (confidence ${Math.round(t.confidence * 100)}%): ${t.text}`)));
}

function renderHistory(items) {
  $("history").replaceChildren(...items.slice(0, 12).map(h => {
    const li = el("li");
    li.append(el("b", null, h.letter));
    const body = el("div");
    body.append(el("span", null, `${h.first_seen.slice(0, 10)} ${utc(h.first_seen)}${h.time ? ` · issued ${h.time}Z` : ""}`));
    body.append(el("div", null, h.text));
    li.append(body);
    return li;
  }));
}

async function load() {
  try {
    const r = await fetch(`data/${icao}/latest.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("banner").className = "banner bad";
    $("banner").textContent = `No data available for ${icao}.`;
    $("headline").textContent = "No data";
  }
  try {
    const r = await fetch(`data/${icao}/history.json?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) renderHistory(await r.json());
  } catch (e) { /* history is optional */ }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
