name: ATIS

# Continuous capture on GitHub Actions.
# Each run listens for ~50 minutes (a check every ~3 minutes) and then starts the
# next run itself, so the chain doesn't depend on GitHub's cron, which is often
# late or skipped. The cron below only restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["atis/**", "index.html", "scripts/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/atis.yml"]

concurrency:
  group: atis
  # New code takes over immediately; otherwise runs queue behind the active one.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  capture:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages
        run: |
          git config --global user.name "digital-atis-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
          else
            mkdir pages && cd pages && git init -q -b gh-pages
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git commit -q --allow-empty -m "Latest ATIS"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repo activity.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atis.yml/enable"

      - name: Capture and publish (~50 min)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # to open an issue for broadcasts that fail to decode
        run: python scripts/publish_loop.py --pages pages --minutes 50

      - name: Start the next run
        # workflow_dispatch is one of the few events a workflow may trigger with its own token.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atis.yml --ref main
